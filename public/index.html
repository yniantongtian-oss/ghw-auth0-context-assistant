<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Context Assistant</title>
    <meta
      name="description"
      content="A personal assistant that signs you in with Auth0 and answers from your saved city, units, and language."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@380;520;640&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">MLH GHW</p>
          <h1>Context Assistant</h1>
        </div>
      </div>
      <p id="mode-line" class="mode-line">Checking session…</p>
    </header>

    <main class="layout">
      <aside class="panel identity" aria-labelledby="identity-heading">
        <h2 id="identity-heading">You</h2>
        <div id="session-card"></div>
        <form id="settings-form">
          <h3>Saved settings</h3>
          <label>
            Home city
            <input id="home-city" name="homeCity" type="text" maxlength="80" autocomplete="address-level2" placeholder="e.g. Portland" disabled />
          </label>
          <label>
            Units
            <select id="units" name="units" disabled>
              <option value="celsius">Celsius</option>
              <option value="fahrenheit">Fahrenheit</option>
            </select>
          </label>
          <label>
            Preferred language
            <select id="language" name="language" disabled>
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="pt">Portuguese</option>
            </select>
          </label>
          <button id="save-settings" type="submit" disabled>Save settings</button>
          <p id="settings-note" class="note">These values are stored for your Auth0 <code>sub</code> and read back through the JWT API.</p>
        </form>
      </aside>

      <section class="panel chat" aria-labelledby="chat-heading">
        <div class="chat-head">
          <h2 id="chat-heading">Chat</h2>
          <p>One turn can read your settings, then call the weather service.</p>
        </div>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <div class="suggestions" role="group" aria-label="Suggested messages">
          <button type="button" data-prompt="What's the weather where I live?" disabled>Weather where I live</button>
          <button type="button" data-prompt="What's the weather in Lisbon?" disabled>Weather in Lisbon</button>
          <button type="button" data-prompt="Show my settings" disabled>Show my settings</button>
          <button type="button" data-prompt="What's on my calendar?" disabled>My calendar</button>
        </div>
        <form id="composer">
          <label class="sr-only" for="message">Message</label>
          <textarea id="message" rows="2" maxlength="500" placeholder="Log in to ask about the weather where you live" disabled></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
